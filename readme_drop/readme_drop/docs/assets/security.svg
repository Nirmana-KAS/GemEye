<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Security layers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101c33"/></linearGradient>
    <style>
      .h { fill:#e6edf3; font:700 13px 'Segoe UI',Arial,sans-serif; }
      .s { fill:#8aa4c8; font:10.5px Consolas,'Courier New',monospace; }
      .t { fill:#e6edf3; font:700 18px 'Segoe UI',Arial,sans-serif; }
      .card { fill:#0f1b30; stroke:#2f81f7; stroke-width:1.4; }
    </style>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <text x="30" y="36" class="t">Security and privacy layers</text>

  <g text-anchor="middle">
    <rect class="card" x="30" y="70" width="140" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="100" y="108" class="h">Auth</text><text x="100" y="130" class="s">Firebase ID token</text><text x="100" y="146" class="s">on every route</text><text x="100" y="170" class="s">revoke check on</text><text x="100" y="184" class="s">sensitive writes</text>

    <rect class="card" x="180" y="70" width="140" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text x="250" y="108" class="h">Ownership</text><text x="250" y="130" class="s">filtered by uid</text><text x="250" y="146" class="s">foreign ids give</text><text x="250" y="162" class="s">404, not 403</text>

    <rect class="card" x="330" y="70" width="140" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="3s" repeatCount="indefinite"/></rect>
    <text x="400" y="108" class="h">Deleted accounts</text><text x="400" y="130" class="s">tokens revoked</text><text x="400" y="146" class="s">2 h tombstone</text><text x="400" y="162" class="s">writes get 401</text>

    <rect class="card" x="480" y="70" width="140" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="4.5s" repeatCount="indefinite"/></rect>
    <text x="550" y="108" class="h">Public verify</text><text x="550" y="130" class="s">secret token</text><text x="550" y="146" class="s">constant-time check</text><text x="550" y="162" class="s">rate limited</text><text x="550" y="178" class="s">no uid or email</text>

    <rect class="card" x="630" y="70" width="140" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="6s" repeatCount="indefinite"/></rect>
    <text x="700" y="108" class="h">Privacy</text><text x="700" y="130" class="s">rejected photos</text><text x="700" y="146" class="s">never stored</text><text x="700" y="162" class="s">delete removes</text><text x="700" y="178" class="s">data and files</text>

    <rect class="card" x="780" y="70" width="190" height="130" rx="12"><animate attributeName="stroke" values="#2f81f7;#7ee787;#2f81f7" dur="9s" begin="7.5s" repeatCount="indefinite"/></rect>
    <text x="875" y="108" class="h">Secrets</text><text x="875" y="130" class="s">.env, models, keys</text><text x="875" y="146" class="s">never in git</text><text x="875" y="162" class="s">private S3, SSE-S3</text><text x="875" y="178" class="s">per-environment DBs</text>
  </g>
  <!-- scanning line -->
  <rect x="30" y="214" width="940" height="3" rx="1.5" fill="#1d3763"/>
  <rect x="30" y="214" width="120" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="x" values="30;850;30" dur="9s" repeatCount="indefinite"/></rect>
</svg>
