<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="GemEye banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/><stop offset=".6" stop-color="#0e2347"/><stop offset="1" stop-color="#1a4a96"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8ec8ff"/>
    </linearGradient>
    <style>
      .title { font:800 76px 'Segoe UI',Arial,sans-serif; fill:url(#tx); letter-spacing:2px; }
      .tag { font:600 20px 'Segoe UI',Arial,sans-serif; fill:#a9c7ee; letter-spacing:1px; }
      .chip { fill:#0f2549; stroke:#2f81f7; stroke-width:1.2; }
      .chipt { font:600 13px Consolas,'Courier New',monospace; fill:#8ec8ff; }
    </style>
  </defs>
  <rect width="1000" height="240" rx="20" fill="url(#bg)"/>
  <!-- drifting bokeh -->
  <g fill="#58a6ff">
    <circle cx="90" cy="60" r="26" opacity=".10"><animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="170" r="40" opacity=".08"><animate attributeName="cy" values="170;145;170" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="14" opacity=".14"><animate attributeName="cx" values="700;730;700" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="205" r="18" opacity=".12"><animate attributeName="cy" values="205;185;205" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- wave -->
  <path d="M0 200 Q125 170 250 200 T500 200 T750 200 T1000 200 V240 H0Z" fill="#2f81f7" opacity=".18">
    <animateTransform attributeName="transform" type="translate" values="0 0;-250 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 215 Q125 190 250 215 T500 215 T750 215 T1000 215 V240 H0Z" fill="#58a6ff" opacity=".14">
    <animateTransform attributeName="transform" type="translate" values="-250 0;0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="108" text-anchor="middle" class="title">GemEye
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="146" text-anchor="middle" class="tag">AUTOMATED 7-GRADE GEMCLOUD COLOUR GRADING OF BLUE SAPPHIRES
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin=".5s" fill="freeze"/>
  </text>
  <g>
    <rect class="chip" x="268" y="168" width="140" height="28" rx="14"/><text class="chipt" x="338" y="187" text-anchor="middle">EfficientNet + RF</text>
    <rect class="chip" x="420" y="168" width="130" height="28" rx="14"/><text class="chipt" x="485" y="187" text-anchor="middle">MC Dropout</text>
    <rect class="chip" x="562" y="168" width="110" height="28" rx="14"/><text class="chipt" x="617" y="187" text-anchor="middle">Grad-CAM</text>
    <rect class="chip" x="684" y="168" width="150" height="28" rx="14"/><text class="chipt" x="759" y="187" text-anchor="middle">Verified certificates</text>
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1s" fill="freeze"/>
  </g>
</svg>
