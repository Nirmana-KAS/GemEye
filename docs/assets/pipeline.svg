<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" role="img" aria-label="GemEye grading pipeline with two colour paths">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .st { fill:#0f1b30; stroke:#2f81f7; stroke-width:1.4; }
      .gate { fill:#1b1530; stroke:#d2a8ff; stroke-width:1.4; }
      .out { fill:#12301f; stroke:#3fb950; stroke-width:1.6; }
      .rej { fill:#35151b; stroke:#f85149; stroke-width:1.4; }
      .h { fill:#e6edf3; font:700 13px 'Segoe UI',Arial,sans-serif; }
      .s { fill:#8aa4c8; font:11px Consolas,'Courier New',monospace; }
      .title { fill:#e6edf3; font:700 18px 'Segoe UI',Arial,sans-serif; }
      .sub { fill:#8aa4c8; font:12px 'Segoe UI',Arial,sans-serif; }
      .wire { stroke:#2b4a78; stroke-width:1.5; fill:none; stroke-dasharray:4 5; }
      .wired { stroke:#6e3a42; stroke-width:1.3; fill:none; stroke-dasharray:3 5; }
    </style>
  </defs>

  <rect width="1000" height="420" rx="18" fill="url(#bg)"/>
  <text x="30" y="38" class="title">Grading pipeline</text>
  <text x="30" y="58" class="sub">one photo in, one certified grade out, rejected photos are never stored</text>

  <!-- main flow path -->
  <path id="main" d="M110 160 H210 H320 H440 H560 H680 H800 H900" class="wire"/>
  <path id="rejp" d="M440 190 V330" class="wired"/>

  <!-- stage 1 -->
  <rect x="40" y="125" width="140" height="70" rx="12" class="st"/>
  <text x="110" y="153" text-anchor="middle" class="h">1. Capture</text>
  <text x="110" y="172" text-anchor="middle" class="s">crop · blur check</text>
  <text x="110" y="186" text-anchor="middle" class="s">JPEG q95 ≤2048px</text>

  <!-- stage 2 -->
  <rect x="200" y="125" width="120" height="70" rx="12" class="st"/>
  <text x="260" y="153" text-anchor="middle" class="h">2. Upload</text>
  <text x="260" y="172" text-anchor="middle" class="s">HTTPS + JWT</text>
  <text x="260" y="186" text-anchor="middle" class="s">POST /grade</text>

  <!-- stage 3 gates -->
  <rect x="340" y="115" width="200" height="90" rx="12" class="gate"/>
  <text x="440" y="140" text-anchor="middle" class="h">3. Quality gates</text>
  <text x="440" y="160" text-anchor="middle" class="s">invalid → no_stone → blurry</text>
  <text x="440" y="176" text-anchor="middle" class="s">→ not_blue → not_recognised</text>
  <text x="440" y="194" text-anchor="middle" class="s">OOD Mahalanobis ≤ 25.69</text>

  <!-- stage 4 -->
  <rect x="560" y="95" width="160" height="130" rx="12" class="st"/>
  <text x="640" y="120" text-anchor="middle" class="h">4. Model path</text>
  <text x="640" y="140" text-anchor="middle" class="s">training CCM</text>
  <text x="640" y="156" text-anchor="middle" class="s">JPEG round-trip</text>
  <text x="640" y="172" text-anchor="middle" class="s">CNN (MC x30) 0.6</text>
  <text x="640" y="188" text-anchor="middle" class="s">RF (12 features) 0.4</text>
  <text x="640" y="208" text-anchor="middle" class="s">ensemble probs</text>

  <!-- stage 5 -->
  <rect x="740" y="95" width="160" height="130" rx="12" class="st"/>
  <text x="820" y="120" text-anchor="middle" class="h">5. Display path</text>
  <text x="820" y="140" text-anchor="middle" class="s">tray white reference</text>
  <text x="820" y="156" text-anchor="middle" class="s">CIELAB · HSB</text>
  <text x="820" y="172" text-anchor="middle" class="s">CIECAM02 J M h s C</text>
  <text x="820" y="188" text-anchor="middle" class="s">ΔE00 to grade typical</text>
  <text x="820" y="208" text-anchor="middle" class="s">Grad-CAM on demand</text>

  <!-- rejection -->
  <rect x="340" y="330" width="200" height="60" rx="12" class="rej"/>
  <text x="440" y="356" text-anchor="middle" class="h">Rejected</text>
  <text x="440" y="376" text-anchor="middle" class="s">message + diagnostics only</text>

  <!-- result -->
  <rect x="560" y="300" width="340" height="90" rx="12" class="out"/>
  <text x="730" y="326" text-anchor="middle" class="h">6. Result + certificate</text>
  <text x="730" y="346" text-anchor="middle" class="s">grade 1-7 · confidence · uncertainty · referred</text>
  <text x="730" y="362" text-anchor="middle" class="s">saved to MongoDB + S3 · GE-YYYYMM-NNNNN</text>
  <text x="730" y="378" text-anchor="middle" class="s">PDF with QR → public verify page</text>

  <path d="M640 225 V262 H730 V300" class="wire"/>
  <path d="M820 225 V262 H730" class="wire"/>

  <!-- packets -->
  <circle r="6" fill="#58a6ff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#main"/></animateMotion>
  </circle>
  <circle r="6" fill="#7ee787" filter="url(#glow)">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#main"/></animateMotion>
  </circle>
  <circle r="5" fill="#f85149" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#rejp"/></animateMotion>
  </circle>

  <text x="450" y="268" class="s" fill="#f85149">fails a gate</text>
  <text x="30" y="405" class="s">Two colour paths: the model path matches training exactly, the display path gives physically meaningful values.</text>
</svg>
